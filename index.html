<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Home-page values, and the fallback for any route whose head has not
         been prerendered. Per-route metadata is written by src/hooks/useDocumentMeta.js
         and baked into dist/<route>/index.html by scripts/prerender.mjs.
         There is deliberately no canonical link element here: a hardcoded one
         would be wrong on every route but "/". -->
    <title>Panwar Knitwear — T-shirt &amp; Winter Wear Manufacturer, Ludhiana</title>
    <meta
      name="description"
      content="Knitting, processing and finishing under one roof in Ludhiana since 1996. Hoodies, fleece, jersey tees and track pants under the ZONIXA and MSP Sports labels."
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Panwar Knitwear" />
    <meta property="og:locale" content="en_IN" />
    <meta
      property="og:title"
      content="Panwar Knitwear — T-shirt &amp; Winter Wear Manufacturer, Ludhiana"
    />
    <meta
      property="og:description"
      content="Knitting, processing and finishing under one roof in Ludhiana since 1996. Home of ZONIXA and MSP Sports."
    />
    <meta property="og:url" content="https://panvar-knitwear.vercel.app/" />
    <meta
      property="og:image"
      content="https://panvar-knitwear.vercel.app/og/og-default.jpg"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Panwar Knitwear — T-shirt &amp; Winter Wear Manufacturer, Ludhiana"
    />
    <meta
      name="twitter:description"
      content="Knitting, processing and finishing under one roof in Ludhiana since 1996. Home of ZONIXA and MSP Sports."
    />
    <meta
      name="twitter:image"
      content="https://panvar-knitwear.vercel.app/og/og-default.jpg"
    />

    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#211e1a" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,400&display=swap"
      rel="stylesheet"
    />
